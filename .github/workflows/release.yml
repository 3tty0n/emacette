name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches Cargo.toml
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "::error::release tags must look like v0.1.0 (got $tag)"
              exit 1
              ;;
          esac
          version="${tag#v}"
          cargo_version=$(awk -F'"' '/^version = / {print $2; exit}' Cargo.toml)
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $cargo_version"
            exit 1
          fi
      - name: Tests
        run: cargo test --locked

  build:
    needs: verify
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          # Both macOS architectures are built on the arm64 runner. Rust can
          # cross-compile between Apple architectures with the installed SDK.
          - target: x86_64-apple-darwin
            os: macos-15
            cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            cross: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
          fallback: none
      - name: Build and package
        run: ./scripts/release.sh --target "${{ matrix.target }}" --output dist
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: emacette-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify packages
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          cd dist
          # Keep in sync with the target matrix above.
          expected=6
          found=$(find . -maxdepth 1 -name 'emacette-*.tar.gz' | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "::error::expected $expected archives, found $found"
            exit 1
          fi
          for archive in emacette-*.tar.gz; do
            test -f "$archive.sha256"
            sha256sum -c "$archive.sha256"
            tar -xOf "$archive" emacette >/dev/null
            case "$archive" in
              "emacette-v${version}-"*) ;;
              *)
                echo "::error::$archive does not match tag $tag"
                exit 1
                ;;
            esac
          done
          ls -l
      - name: Installer smoke test
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          tmp=$(mktemp -d)
          prefix=$(mktemp -d)
          mkdir -p "$tmp/releases/$tag"
          cp dist/* "$tmp/releases/$tag/"
          EMACETTE_BASE_URL="file://$tmp/releases" \
            ./install.sh --release "$tag" --prefix "$prefix"
          "$prefix/bin/emacette" --version
          ./install.sh --uninstall --prefix "$prefix"
          rm -rf "$tmp" "$prefix"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          elif ! gh release create "$tag" dist/* --title "$tag" --generate-notes; then
            # A draft with the same tag is not always visible to view.
            gh release upload "$tag" dist/* --clobber
          fi

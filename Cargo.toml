[package]
name = "emacette"
version = "0.1.2"
edition = "2021"
rust-version = "1.74"
description = "A tiny Emacs-flavored terminal editor with syntax highlighting"
license = "MIT"
readme = "README.md"
keywords = ["editor", "emacs", "terminal", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "emacette"
path = "src/lib.rs"

[[bin]]
name = "emacette"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Do not set `strip = true` here.  On macOS rustc runs the `strip` found on
# PATH, and GNU/Homebrew/MacPorts/Nix strip builds can corrupt a Mach-O file
# or invalidate its code signature.  macOS then kills the binary on launch
# ("Killed: 9"), including when git starts it as $EDITOR.  Release builds use
# scripts/release.sh, which strips explicitly with the platform tool and
# verifies the result.  `cargo build --release` leaves symbols in place.

[package]
name = "nano-emacs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "A tiny Emacs-flavored terminal editor with syntax highlighting"
license = "MIT"
readme = "README.md"
keywords = ["editor", "emacs", "terminal", "tui"]
categories = ["command-line-utilities"]

[lib]
name = "nano_emacs"
path = "src/lib.rs"

[[bin]]
name = "nemacs"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
